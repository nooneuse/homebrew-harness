[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homebrew-harness"
version = "0.1.0"
description = "A composable agent harness with explicit permissions and recoverable execution"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "licenses/*"]
dynamic = ["dependencies"]

[project.scripts]
homebrew-harness = "homebrew_harness.cli:main"
harness-admin = "homebrew_harness.admin:main"
harness-workflow = "homebrew_harness.workflow_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
