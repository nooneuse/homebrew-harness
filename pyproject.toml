[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homebrew-harness"
version = "0.1.0"
description = "A composable agent harness with explicit permissions and recoverable execution"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "licenses/*"]
dynamic = ["dependencies"]

[project.optional-dependencies]
openai = ["openai>=2.54.0,<3"]
anthropic = ["anthropic>=2.7.0,<3"]
dashscope = ["dashscope>=2.0.4,<3"]

[project.scripts]
homebrew-harness = "homebrew_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
"homebrew_harness.context" = ["skills/*/*.md", "skills/*/agents/*.yaml"]
"homebrew_harness.services" = ["skills/*/*.md", "skills/*/agents/*.yaml"]
